name: Deploy to SiteGround

# Manual only for now. Dry run is on by default, so nothing changes on the
# server until Spencer unchecks it. After the first good live run, add
# "push: branches: [main]" so every change publishes on its own.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: list what would change, upload nothing"
        type: boolean
        default: true
      remove_old_files:
        description: "Delete files on the server that are not in this repo (clears SiteGround's placeholder page)"
        type: boolean
        default: false

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      REMOTE_PATH: ${{ secrets.SG_PATH }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets are set
        env:
          SG_SSH_KEY: ${{ secrets.SG_SSH_KEY }}
          SG_HOST: ${{ secrets.SG_HOST }}
          SG_USER: ${{ secrets.SG_USER }}
          SG_PORT: ${{ secrets.SG_PORT }}
        run: |
          missing=""
          [ -z "$SG_SSH_KEY" ] && missing="$missing SG_SSH_KEY"
          [ -z "$SG_HOST" ] && missing="$missing SG_HOST"
          [ -z "$SG_USER" ] && missing="$missing SG_USER"
          [ -z "$SG_PORT" ] && missing="$missing SG_PORT"
          [ -z "$REMOTE_PATH" ] && missing="$missing SG_PATH"
          if [ -n "$missing" ]; then echo "Missing repository secrets:$missing"; exit 1; fi
          echo "All secrets present."

      - name: Load SSH key
        env:
          SG_SSH_KEY: ${{ secrets.SG_SSH_KEY }}
          SG_SSH_PASSPHRASE: ${{ secrets.SG_SSH_PASSPHRASE }}
          SG_HOST: ${{ secrets.SG_HOST }}
          SG_PORT: ${{ secrets.SG_PORT }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SG_SSH_KEY" > ~/.ssh/sg_key && chmod 600 ~/.ssh/sg_key
          # SiteGround keys are passphrase protected; strip it inside this throwaway runner only.
          if [ -n "$SG_SSH_PASSPHRASE" ]; then ssh-keygen -p -P "$SG_SSH_PASSPHRASE" -N "" -f ~/.ssh/sg_key >/dev/null; fi
          ssh-keyscan -p "$SG_PORT" "$SG_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Check connection and target folder
        env:
          SG_HOST: ${{ secrets.SG_HOST }}
          SG_USER: ${{ secrets.SG_USER }}
          SG_PORT: ${{ secrets.SG_PORT }}
        run: |
          # Report problems as annotations so they can be read without the full log.
          ip=$(getent hosts "$SG_HOST" | awk '{print $1}' | head -1)
          if [ -z "$ip" ]; then
            echo "::error::SG_HOST does not resolve. The domain may not point at SiteGround yet. Use the server hostname from Site Tools instead."
            exit 1
          fi
          echo "::notice::SG_HOST resolves to $ip"
          fp=$(ssh-keygen -lf ~/.ssh/sg_key 2>/dev/null | awk '{print $2" "$NF}')
          echo "::notice::Key fingerprint in GitHub: $fp. Logging in as user starting ${SG_USER:0:6}, port ${#SG_PORT}-digit."
          if ! out=$(ssh -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=accept-new -i ~/.ssh/sg_key -p "$SG_PORT" "$SG_USER@$SG_HOST" "test -d '$REMOTE_PATH' && echo FOLDER_OK || echo FOLDER_MISSING" 2>&1); then
            echo "::error::SSH failed: $(printf '%s' "$out" | tail -3 | tr '\n' ' ')"
            exit 1
          fi
          case "$out" in
            *FOLDER_OK*) echo "::notice::Connected, and the target folder exists." ;;
            *) echo "::error::Connected, but the folder in SG_PATH does not exist."; exit 1 ;;
          esac

      - name: Upload site
        run: |
          FLAGS="-rlvz --checksum --exclude=.git/ --exclude=.github/ --exclude=README.md --exclude=CLAUDE.md --exclude=.gitkeep"
          if [ "${{ inputs.dry_run }}" = "true" ]; then FLAGS="$FLAGS --dry-run"; echo "DRY RUN: nothing will be uploaded"; fi
          if [ "${{ inputs.remove_old_files }}" = "true" ]; then FLAGS="$FLAGS --delete --exclude=.well-known/"; fi
          rsync $FLAGS -e "ssh -o StrictHostKeyChecking=accept-new -i $HOME/.ssh/sg_key -p ${{ secrets.SG_PORT }}" ./ "${{ secrets.SG_USER }}@${{ secrets.SG_HOST }}:$REMOTE_PATH/"
